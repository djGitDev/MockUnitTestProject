stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

maven_build:
  stage: build
  image: maven:3.8.4-openjdk-22
  script:
    - mvn clean install
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

maven_test:
  stage: test
  image: maven:3.8.4-openjdk-22
  script:
    - mvn test jacoco:report
  artifacts:
    when: always
    paths:
      - target/site/jacoco/
    reports:
      junit: target/surefire-reports/*.xml
