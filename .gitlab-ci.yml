image: maven:3-eclipse-temurin-17

stages:
  - build
  - test
  - analyse

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Définie l'emplacement du cache de la tâche d'analyse
  GIT_DEPTH: "0"  # Indique à git de récupérer toutes les branches du projet, nécessaire pour l'analyse

# Stage de build : Compilation du projet
build:
  stage: build
  script:
    - mvn clean install -DskipTests

# Stage de test : Exécution des tests et génération du rapport Jacoco
test:
  stage: test
  script:
    - mvn test jacoco:prepare-agent jacoco:report
  artifacts:
    when: always
    paths:
      - target/site/jacoco/
    reports:
      junit: target/surefire-reports/*.xml

# Stage d'analyse : Analyse SonarQube
analyse:
  stage: analyse
  script:
    - mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
  variables:
    SONAR_SCANNER_PARAMS: "-Dsonar.java.binaries=target/classes -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/