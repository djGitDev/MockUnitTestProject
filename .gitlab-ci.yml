stages:
  - build
  - test
  - sonar

variables:

  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Xmx1024m -Xms512m"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Définie l'emplacement du cache de la tâche d'analyse
  GIT_DEPTH: "0"  # Indique à git de récupérer toutes les branches du projet, nécessaire pour l'analyse
  SONAR_HOST_URL: "http://ton-serveur-sonarqube:9000"  # Remplace par l'URL de ton serveur SonarQube
  SONAR_TOKEN: $SONAR_TOKEN  # Assure-toi que ce token est ajouté dans les variables CI/CD de GitLab

# Étape de build
maven_build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn clean install
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

# Étape de test avec couverture Jacoco
maven_test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn test jacoco:report
  artifacts:
    when: always
    paths:
      - target/site/jacoco/
    reports:
      junit: target/surefire-reports/*.xml

# Étape d'analyse SonarQube
sonarqube_scan:
  stage: sonar
  image: maven:3-eclipse-temurin-17  # Utilisation de l'image recommandée pour SonarQube
  script:
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=flight-booking-example -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'